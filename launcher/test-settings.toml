# Nightreign Invasions - optional test settings. Read at every "Play with the mod".
# Nothing here is needed to play: invasions work with every line false.
# PL: Opcjonalne ustawienia testowe; do grania nic tu nie trzeba zmieniać.

team-test = false   # solo tests only: 90 s into an expedition you turn red and monsters ignore you for 180 s
slow-time = false   # both players the same: day and circle clocks run about ten times slower (the host's counts)
full-sync = true    # invader: ask the host for its full world state (enemies, events); false only for tests
loot-test = false   # logging only: what lies on the ground, every pickup and equipment dialog
no-host = false           # test: your own expedition opens no host session (nobody can invade you)
test-level = 0            # test: your own expedition sets your level to this number 5 s after the start (0 = off)
boss-flow = 0             # test (host only): 1 = the day runs and the circle clock waits at 22:59 until a region boss is dead (after 5 min there the day starts again); 2 = clock stands still all day (comparison)
revive-hits = false       # test, invasions: a downed player is finished by the other side in 2 hits, raised by its own side in 5
no-sprint = true          # the fast run (sprint) is off; false turns it back on
ult-pvp = 100             # test, invasions: ultimate damage against players of the other side in percent (100 = unchanged, 0..999)
ally = false              # test, joining player only: "Invasion" joins the host's expedition as an ally (squad member) instead of an invader
party = 0                 # test only: a number mixed into the squad matchmaking key, to keep test runs apart (0 = off)
