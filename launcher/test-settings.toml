# Nightreign Invasions - optional test settings. Read at every "Play with the mod".
# Nothing here is needed to play: invasions work with every line false.
# PL: Opcjonalne ustawienia testowe; do grania nic tu nie trzeba zmieniać.

team-test = false   # solo tests only: 90 s into an expedition you turn red and monsters ignore you for 180 s
no-rain = false     # both players the same: the rain outside the circle does no damage
slow-time = false   # both players the same: day and circle clocks run about ten times slower (the host's counts)
full-sync = true    # invader: ask the host for its full world state (enemies, events); false only for tests
loot-test = false   # logging only: what lies on the ground, every pickup and equipment dialog
